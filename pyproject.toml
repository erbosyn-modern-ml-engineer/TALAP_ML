[build-system]
requires = ["setuptools>=80,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "talap-ai-backend"
version = "0.1.0"
description = "Backend and AI orchestration for the TALAP universal commerce assistant."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [
  { name = "TALAP Team" }
]
dependencies = [
  "fastapi[standard]>=0.139,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.14,<3",
  "sqlalchemy[asyncio]>=2.0.51,<2.1",
  "alembic>=1.18,<2",
  "asyncpg>=0.30,<1",
  "redis>=5.3,<6",
  "arq>=0.28,<0.29",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.32,<1",
  "structlog>=26.1,<27",
  "pgvector>=0.5,<1",
  "orjson>=3.10,<4",
  "tenacity>=9.1,<10",
  "cryptography>=45,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "talap*"]
exclude = ["tests*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["arq.*", "pgvector.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["talap", "apps"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0
