[alembic]
script_location = migrations
prepend_sys_path = .
# Placeholder only. The real URL is resolved at runtime from Settings
# (.env) via the -x database=main|test argument in migrations/env.py.
sqlalchemy.url = postgresql+asyncpg://unused:unused@localhost/unused

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
